    /api/v1/lgpd/solicitar-exclusao:
        post:
            description: |
                Cria uma solicitação; o worker anonimiza automaticamente (username, e-mail, nome, hash de senha, vínculo Keycloak e papéis). NUNCA um `DELETE` — a linha e a trilha de auditoria são mantidas como registro legal (art. 16). Idempotente: se já há uma solicitação em aberto, devolve ela com 200.
            operationId: lgpdRequestErasure
            responses:
                "200":
                    description: Já havia uma solicitação `pending`/`processing`.
                "202":
                    description: '`{data:{request_id, status:"pending"}}`'
                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: Solicita a eliminação/anonimização dos dados (LGPD art. 18, VI)
            tags:
                - lgpd
