servers:
    - description: Desenvolvimento local (docker compose)
      url: http://localhost:8000
    - description: Mesma origem (produção, atrás de um reverse proxy)
      url: /
tags:
    - description: 'Acervo — Gestão Arquivística. Plug-in — Unidades de arquivamento nas três idades (Lei 10.301/2019): classificação pela TTDD, prazos de guarda, localização física, bloqueio judicial, eliminação, recolhimento ao Arquivo Público, instruções normativas e arquivos privados de interesse público. Depende de: atlas.'
      name: acervo
    - name: administracao
    - description: Atlas — Procedimentos e Temporalidade. Plug-in — Procedimentos canônicos de processo (padrão SEI), Tabela de Temporalidade (TTDD) oficial e assistente sobre fluxos e TTDD.
      name: atlas
    - description: Auditoria. Núcleo — Registro transacional e imutável de operações com encadeamento de hash SHA-256.
      name: audit
    - description: |
        Login local por usuário/senha — um caminho ADICIONAL ao Keycloak, nunca um substituto (ver ADR 003-local-auth-rsa-hardening.md). Sem autenticação prévia, por definição.
      name: auth
    - description: Blog. Plug-in — Publicações institucionais, artigos e comunicados.
      name: blog
    - name: branding
    - description: Agenda. Plug-in — Eventos corporativos e reserva de salas sem conflito de horário.
      name: calendar
    - description: Catálogo de Serviços. Plug-in — Central pública de serviços institucionais.
      name: catalog
    - description: Contato. Plug-in — Formulário público institucional com rate limit dedicado.
      name: contact
    - description: Diretório. Plug-in — Consulta de pessoas e setores com base nos dados sincronizados do AD.
      name: directory
    - description: Egress. Plug-in — Webhooks de saída assíncronos e assinados, com proteção anti-SSRF (n8n, Zabbix, Grafana).
      name: egress
    - description: Módulo Modelo. Plug-in — Blueprint de referência para novos plugins (desativado por padrão).
      name: example
    - description: Arquivos. Plug-in — Gestão de pastas e arquivos sobre MinIO com permissões por grupo/perfil.
      name: files
    - name: ia
    - description: IAM & Usuários. Núcleo — Identidades, sessões, RBAC multi-escopo (Entidades, Unidades, Departamentos) e mapeamento de grupos do AD.
