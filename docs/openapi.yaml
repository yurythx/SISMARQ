    /api/v1/admin/keycloak:
        get:
            description: |
                Restrito ao papel nexus-admin (§ Configuração Dinâmica do Keycloak). Nunca devolve um client secret em texto plano — só se um está definido (`client_secret_set`/`frontend_client_secret_set`).
            operationId: getKeycloakSettings
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/Envelope'
                                    - properties:
                                        data:
                                            $ref: '#/components/schemas/KeycloakSettingsStatus'
                                      type: object
                    description: Configuração atual (do Postgres, se já salva; senão o que vem de variável de ambiente).
                    x-sismarq-generated: true
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
            security:
                - bearerAuth:
                    - keycloak:manage
            summary: Estado atual da configuração do Keycloak
            tags:
                - administracao
        put:
            description: |
                Restrito ao papel nexus-admin. SEMPRE testa o discovery OIDC contra `issuer_url` antes de persistir — se o discovery falhar, nada é salvo e a resposta é 422. Depois de salvar com sucesso, o backend recarrega o verificador de tokens (`auth.Verifier.Reload`) na hora, sem reiniciar o processo — a nova configuração já vale para o próximo token verificado. Um `client_secret`/`frontend_client_secret` vazio ou ausente no corpo significa "manter o segredo já salvo", nunca "apagar".
            operationId: saveKeycloakSettings
            requestBody:
                content:
                    application/json:
                        example:
                            audience: nexus-backend
                            client_id: nexus-backend
                            client_secret: s3gr3d0-do-backend
                            frontend_client_id: nexus-frontend
                            frontend_client_secret: s3gr3d0-do-frontend
                            issuer_url: https://sso.orgao.gov.br/realms/nexus
                            realm: nexus
                        schema:
                            properties:
                                audience:
                                    type: string
                                client_id:
                                    type: string
                                client_secret:
                                    description: Vazio/ausente = manter o segredo já salvo.
                                    type: string
                                frontend_client_id:
                                    type: string
                                frontend_client_secret:
                                    description: Vazio/ausente = manter o segredo já salvo.
                                    type: string
                                issuer_url:
                                    type: string
                                realm:
                                    type: string
                            required:
                                - issuer_url
                                - realm
                                - client_id
                                - audience
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/Envelope'
                                    - properties:
                                        data:
                                            properties:
                                                settings:
                                                    $ref: '#/components/schemas/KeycloakSettingsStatus'
                                                test:
                                                    $ref: '#/components/schemas/KeycloakTestResult'
                                            type: object
                                      type: object
                    description: Configuração salva e verificador recarregado.
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "422":
                    description: O discovery OIDC contra issuer_url falhou — nada foi salvo.
            security:
                - bearerAuth:
                    - keycloak:manage
            summary: Salva a configuração do Keycloak
            tags:
                - administracao
    /api/v1/admin/keycloak/test:
        post:
            description: |
                Restrito ao papel nexus-admin. Nunca persiste nada — só tenta o discovery OIDC contra `issuer_url` e, se `client_id`/`client_secret` forem informados, uma troca `client_credentials` contra o token_endpoint descoberto (best-effort: falhar aqui não significa credenciais erradas, só que o client pode não ter "Service Accounts" habilitado no Keycloak — ver `KeycloakTestResult`). Um `client_secret` vazio/ausente reutiliza o segredo já salvo, se houver, para não obrigar o admin a redigitá-lo só para testar.
            operationId: testKeycloakSettings
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                audience:
                                    type: string
                                client_id:
                                    type: string
                                client_secret:
                                    type: string
                                issuer_url:
                                    type: string
                            required:
                                - issuer_url
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/Envelope'
                                    - properties:
                                        data:
                                            $ref: '#/components/schemas/KeycloakTestResult'
                                      type: object
                    description: Resultado do teste (mesmo em caso de falha — ver `status`).
                    x-sismarq-generated: true
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
            security:
                - bearerAuth:
                    - keycloak:manage
            summary: Testa uma configuração do Keycloak sem salvar
            tags:
                - administracao
