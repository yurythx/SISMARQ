    /api/v1/lgpd/accept:
        post:
            description: |
                Grava o consentimento com IP e User-Agent na trilha de auditoria imutável (audit_logs). Idempotente por (user_id, term_version) — aceitar de novo a mesma versão só atualiza o carimbo de tempo.
            operationId: acceptLGPDTerms
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                term_version:
                                    example: v1.0.0-2026
                                    type: string
                            required:
                                - term_version
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Envelope'
                    description: Aceite registrado com sucesso.
                "401":
                    $ref: '#/components/responses/Unauthorized'
            summary: Registra o aceite dos Termos LGPD
            tags:
                - lgpd
    /api/v1/lgpd/accept-anon:
        post:
            description: |
                Rota pública, rate-limited por IP. `device_hash` é um identificador opaco gerado no cliente (sem dado pessoal). Grava em `anonymous_consents`; um trigger espelha na trilha imutável (`lgpd_consent_given_anon`, `user_id` nulo).
            operationId: lgpdAcceptAnon
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                device_hash:
                                    maxLength: 128
                                    minLength: 8
                                    type: string
                                term_version:
                                    example: v1.0.0-2026
                                    type: string
                            required:
                                - device_hash
                            type: object
                required: true
            responses:
                "200":
                    description: '`{data:{status:"ok", term_version, accepted_at}}`'
                "422":
                    description: '`device_hash` ausente ou fora de 8–128 caracteres.'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
            summary: Registra o consentimento de um visitante NÃO autenticado
            tags:
                - lgpd
    /api/v1/lgpd/meus-dados:
        get:
            description: |
                Pacote JSON com a conta, os registros de consentimento, a trilha de auditoria e as solicitações do próprio titular — acesso e portabilidade. Síncrono. Auditado como `lgpd.data_export.self`.
            operationId: lgpdExportMyData
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/Envelope'
                                    - properties:
                                        data:
                                            $ref: '#/components/schemas/LgpdMyDataPackage'
                                      type: object
                    description: |
                        `meus-dados-nexus-<timestamp>.json` (`Content-Disposition: attachment`).
                    x-sismarq-generated: true
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "404":
                    description: Nenhuma conta local associada a esta identidade ainda.
            security:
                - bearerAuth: []
            summary: Baixa todos os dados pessoais do titular (LGPD art. 18, II e V)
            tags:
                - lgpd
