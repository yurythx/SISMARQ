    /api/v1/audit/export:
        get:
            description: |
                Gera `relatorio_auditoria_lai_<timestamp>.<ext>` com id, usuário, ação, tipo/id de recurso, correlation_id, IP, metadata e data/hora (UTC) — mais recente primeiro. Restrito a `audit:read`.
                Janela `from`/`to` (default: últimos 30 dias, teto de 366); filtro opcional por `action`; paginação keyset por `cursor` (o `X-Next-Cursor` da resposta anterior). Formato por `format=` ou pelo header `Accept`; o default é CSV. Cada exportação bem-sucedida é ela mesma registrada na trilha (`audit.exported`). Metadados do dataset vão em cabeçalhos `X-Dataset-*` / `X-Generated-At`.
            operationId: exportAuditLog
            parameters:
                - description: Início da janela — `AAAA-MM-DD` ou RFC3339 (UTC).
                  in: query
                  name: from
                  required: false
                  schema:
                    example: "2026-01-01"
                    type: string
                - description: Fim da janela — `AAAA-MM-DD` ou RFC3339 (UTC).
                  in: query
                  name: to
                  required: false
                  schema:
                    example: "2026-02-01"
                    type: string
                - description: 'Filtra por um valor exato de `action` (ex.: `login`).'
                  in: query
                  name: action
                  required: false
                  schema:
                    type: string
                - description: Formato de saída (tem prioridade sobre o header `Accept`).
                  in: query
                  name: format
                  required: false
                  schema:
                    default: csv
                    enum:
                        - csv
                        - json
                        - xml
                    type: string
                - description: Cursor keyset devolvido em `X-Next-Cursor` para a próxima página.
                  in: query
                  name: cursor
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                type: object
                        application/xml:
                            schema:
                                type: string
                        text/csv:
                            schema:
                                type: string
                    description: |
                        Arquivo no formato pedido. Cabeçalhos `X-Dataset-Name`, `X-Dataset-Window-From`, `X-Dataset-Window-To`, `X-Dataset-Rows`, `X-Generated-At` e, quando há mais páginas, `X-Next-Cursor`.
                "400":
                    description: Janela inválida (invertida, maior que 366 dias) ou cursor malformado.
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
            security:
                - bearerAuth:
                    - audit:read
            summary: Exporta a trilha de auditoria (LAI) em CSV, JSON ou XML
            tags:
                - audit
