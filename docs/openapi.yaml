    /api/v1/auth/login:
        post:
            description: |
                Rota pública — o chamador ainda não está autenticado. Responde 404 se LOCAL_AUTH_ENABLED estiver desligado no backend. O token emitido é assinado RS256 com uma chave RSA própria deste subsistema (nunca compartilhada com o Keycloak — ver ADR 003-local-auth-rsa-hardening.md) e pode ser usado como Bearer nos mesmos endpoints autenticados que aceitam um token do Keycloak.

                Toda falha (usuário inexistente, conta só-Keycloak, conta inativa, conta temporariamente bloqueada por excesso de tentativas, ou senha errada) retorna exatamente a mesma resposta 401 genérica — nunca dá para descobrir, por tentativa e erro, qual delas ocorreu. Uma conta é bloqueada por 15 minutos depois de 5 tentativas seguidas de senha errada.
            operationId: localLogin
            requestBody:
                content:
                    application/json:
                        example:
                            password: Admin123!
                            username: admin
                        schema:
                            properties:
                                password:
                                    format: password
                                    type: string
                                username:
                                    type: string
                            required:
                                - username
                                - password
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/Envelope'
                                    - properties:
                                        data:
                                            $ref: '#/components/schemas/LocalauthLoginResponse'
                                      type: object
                    description: Credenciais válidas — token emitido.
                    x-sismarq-generated: true
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "404":
                    content:
                        application/json:
                            example:
                                data: null
                                error:
                                    code: NOT_FOUND
                                    message: local login is not enabled
                    description: Login local está desligado (LOCAL_AUTH_ENABLED=false).
                "429":
                    $ref: '#/components/responses/TooManyRequests'
            security: []
            summary: Login local por usuário/senha
            tags:
                - auth
    /api/v1/auth/logout:
        post:
            description: |
                Não invalida o token (stateless — o JWT vale até expirar); o frontend descarta o cookie de sessão do seu lado. O papel deste endpoint é deixar em `audit_logs` o evento de logout (§49). Idempotente.
            operationId: authLogout
            responses:
                "200":
                    description: '`{data:{status:"ok"}}`'
                "401":
                    $ref: '#/components/responses/Unauthorized'
            security:
                - bearerAuth: []
            summary: Encerra a sessão (registra na trilha de auditoria)
            tags:
                - auth
