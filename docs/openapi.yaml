    /ws:
        get:
            description: |
                Não modelado como uma operação REST — incluído aqui apenas para descoberta. Exige `?ticket=<valor>` obtido em `POST /api/v1/ws/ticket`. Ao conectar, o cliente recebe todo envelope de evento da plataforma (`{id,type,version,source,occurred_at,correlation_id,payload}`) como um frame de texto JSON — ver `EventEnvelope` abaixo.
            operationId: websocketUpgrade
            parameters:
                - in: query
                  name: ticket
                  required: true
                  schema:
                    type: string
            responses:
                "101":
                    description: Switching Protocols — WebSocket estabelecido.
                "401":
                    description: Ticket ausente, inválido, expirado ou já utilizado.
            security: []
            summary: Upgrade de WebSocket (não é um endpoint HTTP comum)
            tags:
                - websocket
