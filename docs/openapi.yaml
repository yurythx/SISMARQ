# Gerado a partir de backend/docs/openapi.json — ver internal/app/openapi_test.go.
components:
    parameters:
        IdempotencyKey:
            description: |
                Chave única por operação lógica (recomenda-se um UUID gerado no cliente), escopada ao usuário autenticado. Reenviar a mesma requisição com a mesma chave reproduz a resposta original em vez de reexecutar a operação — ver a nota de Idempotência na descrição geral da API.
            example: 3f2b9e0a-6d34-4e77-9c3e-2b6f8e6b6a3d
            in: header
            name: X-Idempotency-Key
            required: false
            schema:
                type: string
        Page:
            in: query
            name: page
            schema:
                default: 1
                minimum: 1
                type: integer
        PageSize:
            in: query
            name: page_size
            schema:
                default: 20
                maximum: 200
                minimum: 1
                type: integer
    responses:
        Forbidden:
            content:
                application/json:
                    example:
                        data: null
                        error:
                            code: FORBIDDEN
                            message: insufficient permission
            description: Autenticado, mas sem o role/permissão necessário.
        IdempotencyConflict:
            content:
                application/json:
                    examples:
                        in_progress:
                            summary: Requisição original ainda em andamento
                            value:
                                data: null
                                error:
                                    code: IDEMPOTENCY_KEY_IN_PROGRESS
                                    message: a request with this Idempotency-Key is already being processed
                        reused:
                            summary: Mesma chave usada com um corpo diferente
                            value:
                                data: null
                                error:
                                    code: IDEMPOTENCY_KEY_REUSED
                                    message: Idempotency-Key was already used with a different request
                    schema:
                        $ref: '#/components/schemas/Envelope'
            description: |
                Conflito relacionado à Idempotency-Key: `IDEMPOTENCY_KEY_IN_PROGRESS` se uma requisição com a mesma chave ainda está sendo processada, ou `IDEMPOTENCY_KEY_REUSED` se a chave já foi usada com um corpo de requisição diferente.
        IntegrationUnavailable:
            content:
                application/json:
                    examples:
                        circuit_open:
                            summary: Circuit breaker aberto
                            value:
                                data: null
                                error:
                                    code: CIRCUIT_OPEN
                                    message: 'example-provider: temporarily unavailable (circuit breaker open)'
                        feature_disabled:
                            summary: Feature flag desabilitada por um administrador
                            value:
                                data: null
                                error:
                                    code: FEATURE_DISABLED
                                    message: the "module_exemplos_enabled" feature is currently disabled
                    schema:
                        $ref: '#/components/schemas/Envelope'
            description: |
                A integração externa está temporariamente indisponível. `CIRCUIT_OPEN` (o circuit breaker interno abriu depois de falhas consecutivas — tende a se resolver sozinho) e `FEATURE_DISABLED` (um nexus-admin desligou a integração via feature flag — só volta quando religada) usam o mesmo status 503, diferenciados pelo `error.code`.
        ModuleDisabledOrNotFound:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Envelope'
            description: Recurso inexistente ou módulo desativado no Kernel (MODULE_DISABLED).
        NotFound:
            content:
                application/json:
                    example:
                        data: null
                        error:
                            code: NOT_FOUND
                            message: resource not found
            description: O recurso não existe.
        Success:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Envelope'
            description: Sucesso — payload em `data` (listas paginadas trazem `meta`).
        TooManyRequests:
            content:
                application/json:
                    example:
                        data: null
                        error:
                            code: RATE_LIMITED
                            message: too many requests, please try again later
            description: Limite de requisições excedido.
        Unauthorized:
            content:
                application/json:
                    example:
                        data: null
                        error:
                            code: UNAUTHORIZED
                            message: invalid or expired access token
                    schema:
                        $ref: '#/components/schemas/Envelope'
            description: Access token ausente, inválido ou expirado.
        ValidationError:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Envelope'
            description: Dados inválidos (VALIDATION_ERROR) ou regra de negócio violada.
